<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>办公大厅 · 神经流</title>
<script>
  (function () {
    var q = new URLSearchParams(location.search).get('theme');
    var t = q === 'dark' || q === 'light' ? q : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --bg: #f6f5f1; --stage: #f6f5f1; --panel: #fbfaf7; --card: #ffffff;
  --ink: #1d1d1f; --ink2: #55555b; --ink3: #8e8e93; --ink4: #b8b8bd;
  --line: rgba(29,29,31,.08); --line2: rgba(29,29,31,.14);
  --neutral: #8f8a80; --amber: #e8940a; --red: #e5484d;
  --shadow: 0 1px 2px rgba(29,29,31,.05), 0 6px 18px -8px rgba(29,29,31,.14);
  --shadow-hi: 0 2px 4px rgba(29,29,31,.06), 0 18px 40px -16px rgba(29,29,31,.28);
  --ribbon-op: .34; --ribbon-hi: .62; --ribbon-dim: .06; --blend: multiply;
  --seg: rgba(29,29,31,.06); --seg-on: #fff;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0b0b0d; --stage: #0b0b0d; --panel: #111114; --card: #17171b;
  --ink: #f2f2f4; --ink2: #b4b4bb; --ink3: #7c7c85; --ink4: #4a4a52;
  --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.13);
  --neutral: #8a8f9c; --amber: #ffb340; --red: #ff6369;
  --shadow: 0 0 0 1px rgba(255,255,255,.06), 0 10px 30px -12px rgba(0,0,0,.7);
  --shadow-hi: 0 0 0 1px rgba(255,255,255,.12), 0 20px 50px -18px rgba(0,0,0,.9);
  --ribbon-op: .2; --ribbon-hi: .5; --ribbon-dim: .04; --blend: screen;
  --seg: rgba(255,255,255,.06); --seg-on: #2a2a30;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; transition: background .4s ease, color .4s ease; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; height: 100dvh; }
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 18px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.6) blur(20px); -webkit-backdrop-filter: saturate(1.6) blur(20px); position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.brand svg { display: block; }
.brand small { font-weight: 500; color: var(--ink3); font-size: 12px; margin-left: 2px; }
.seg { display: flex; background: var(--seg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 16px; border-radius: 7px; font-size: 13px; color: var(--ink2); cursor: pointer; transition: color .2s, background .2s; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 .5px rgba(0,0,0,.04); }
.seg button:not([aria-pressed="true"]):hover { color: var(--ink); }
.top-r { justify-self: end; display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 32px; height: 32px; border-radius: 9px; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--ink2); transition: background .2s, color .2s; }
.icon-btn:hover { background: var(--seg); color: var(--ink); }
.icon-btn .moon { display: none; } [data-theme="dark"] .icon-btn .sun { display: none; } [data-theme="dark"] .icon-btn .moon { display: block; }
.main { display: grid; grid-template-columns: 1fr 400px; min-height: 0; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--stage); }
[data-theme="dark"] .stage { background: radial-gradient(1200px 700px at 42% 46%, #131318 0%, #0b0b0d 70%); }
.stage-grid { position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: radial-gradient(circle at 1px 1px, var(--line2) 1px, transparent 1.2px); background-size: 24px 24px;
  -webkit-mask-image: radial-gradient(80% 70% at 45% 50%, #000 30%, transparent 100%); mask-image: radial-gradient(80% 70% at 45% 50%, #000 30%, transparent 100%); }
.cols { position: absolute; left: 0; right: 0; top: 18px; height: 34px; pointer-events: none; }
.col-h { position: absolute; top: 0; font-size: 11px; letter-spacing: .08em; color: var(--ink3); display: flex; align-items: baseline; gap: 8px; white-space: nowrap; transition: left .5s cubic-bezier(.2,.8,.2,1); }
.col-h b { font-family: var(--mono); font-weight: 500; color: var(--ink4); font-size: 10px; }
.col-h span { color: var(--ink2); font-weight: 600; letter-spacing: .04em; font-size: 12px; }
.col-h i { font-style: normal; color: var(--ink3); letter-spacing: 0; }
svg.ribbons { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
svg.ribbons path.rb { mix-blend-mode: var(--blend); opacity: var(--ribbon-op); transition: opacity .35s ease; cursor: pointer; }
svg.ribbons path.rb.hot { opacity: var(--ribbon-hi); }
.stage.focus svg.ribbons path.rb { opacity: var(--ribbon-dim); }
.stage.focus svg.ribbons path.rb.on { opacity: var(--ribbon-hi); }
[data-theme="dark"] svg.ribbons path.rb.hot, [data-theme="dark"] .stage.focus svg.ribbons path.rb.on { filter: url(#glow); }
svg.ribbons rect { transition: opacity .35s; }
.stage.focus svg.ribbons rect:not(.on) { opacity: .12; }
canvas.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.nodes { position: absolute; inset: 0; pointer-events: none; }
.node { position: absolute; left: 0; top: 0; pointer-events: auto; will-change: transform; transition: opacity .35s ease, filter .35s ease; }
.stage.focus .node:not(.on) { opacity: .28; filter: saturate(.4); }
.port { position: absolute; width: 4px; border-radius: 3px; transition: opacity .3s; }
.port.l { left: -2px; } .port.r { right: -2px; }
.port.seg-p { position: absolute; width: 4px; border-radius: 2px; }
.ring { position: absolute; border-radius: 50%; pointer-events: none; border: 2px solid currentColor; opacity: 0; transform: scale(.6); animation: ring 1.1s cubic-bezier(.16,.84,.3,1) forwards; }
.ring.fill { border: 0; background: currentColor; animation-name: ringf; }
@keyframes ring { 0% { opacity: .7; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.9); } }
@keyframes ringf { 0% { opacity: .22; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.7); } }
/* 你 */
.n-you { width: 64px; display: grid; justify-items: center; gap: 8px; cursor: pointer; }
.n-you .dot { width: 46px; height: 46px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 650; font-size: 16px; position: relative; box-shadow: var(--shadow); }
.n-you .lbl { font-size: 11px; color: var(--ink3); }
/* 管家 */
.n-butler { width: 124px; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); display: grid; align-content: center; justify-items: center; gap: 4px; cursor: pointer; transition: box-shadow .3s, opacity .35s, filter .35s; }
.n-butler:hover { box-shadow: var(--shadow-hi); }
.n-butler .av { width: 74px; height: 74px; position: relative; }
.n-butler .nm { font-size: 14px; font-weight: 650; letter-spacing: .02em; }
.n-butler .st { font-size: 11px; color: var(--ink3); text-align: center; line-height: 1.4; padding: 0 10px; min-height: 15px; }
/* 机器人 */
.n-bot { width: 232px; border-radius: 16px; background: var(--card); box-shadow: var(--shadow); cursor: pointer; transition: box-shadow .3s, opacity .35s, filter .35s; }
.n-bot:hover, .n-bot.open { box-shadow: var(--shadow-hi); }
.n-bot .hd { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: center; padding: 8px 12px 8px 8px; height: 64px; }
.n-bot .av { width: 48px; height: 48px; position: relative; }
.n-bot .tx { min-width: 0; display: grid; gap: 3px; }
.n-bot .row1 { display: flex; align-items: center; gap: 6px; }
.n-bot .nm { font-size: 13.5px; font-weight: 650; white-space: nowrap; }
.pill { font-size: 10.5px; padding: 1px 7px 1px 6px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; background: var(--seg); color: var(--ink2); white-space: nowrap; }
.pill::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.pill.working { color: #1f9d55; background: rgba(52,199,89,.12); } [data-theme="dark"] .pill.working { color: #4cd97b; }
.pill.waiting { color: #b86e00; background: rgba(255,170,0,.14); } [data-theme="dark"] .pill.waiting { color: #ffb340; }
.pill.error { color: var(--red); background: rgba(229,72,77,.12); }
.pill.idle { color: var(--ink3); } .pill.paused { color: var(--ink3); }
.pill.paused::before { border-radius: 1px; width: 5px; height: 6px; background: linear-gradient(90deg, currentColor 35%, transparent 35% 65%, currentColor 65%); }
.n-bot .cap-t { font-size: 11.5px; color: var(--ink2); line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .3s; }
.n-bot .cap-t.flash { color: var(--ink); }
.n-bot.paused .av, .n-bot.paused .nm { opacity: .55; }
.n-bot .more { overflow: hidden; height: 0; padding: 0 14px; opacity: 0; transition: opacity .3s .1s; }
.n-bot.open .more { opacity: 1; }
.more .kv { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink3); padding: 4px 0; }
.more .kv b { font-weight: 500; color: var(--ink2); }
.bar { height: 4px; border-radius: 3px; background: var(--seg); overflow: hidden; margin: 2px 0 8px; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.chip { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--seg); color: var(--ink2); }
.chip b { font-family: var(--mono); font-weight: 500; margin-left: 4px; color: var(--ink); }
.log { font-size: 11px; color: var(--ink3); display: grid; gap: 3px; margin-bottom: 10px; }
.log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log time { font-family: var(--mono); color: var(--ink4); margin-right: 6px; }
.more .act { width: 100%; border: 0; border-radius: 9px; padding: 7px; font-size: 12px; font-weight: 600; background: var(--seg); cursor: pointer; margin-bottom: 12px; }
.more .act:hover { background: var(--line2); }
/* 能力 */
.n-cap { width: 190px; cursor: pointer; }
.n-cap .stack { position: absolute; left: 0; top: 0; width: 10px; border-radius: 5px; overflow: hidden; background: var(--line2); }
.n-cap .stack i { position: absolute; left: 0; width: 100%; }
.n-cap .info { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); width: 170px; display: grid; gap: 3px; }
.n-cap .r1 { display: flex; align-items: baseline; gap: 8px; }
.n-cap .nm { font-size: 13px; font-weight: 600; }
.n-cap .ct { font-family: var(--mono); font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; margin-left: auto; transition: color .3s, transform .4s cubic-bezier(.3,1.6,.5,1); }
.n-cap .ct.bump { color: var(--ink); transform: scale(1.25); }
.n-cap .r2 { display: flex; align-items: center; gap: 6px; min-height: 18px; }
.n-cap .avs { display: flex; }
.n-cap .avs > div { width: 18px; height: 18px; margin-right: -3px; position: relative; }
.n-cap .ht { font-size: 11px; color: var(--ink3); white-space: nowrap; }
.n-cap.zero .nm { color: var(--ink3); font-weight: 500; }
.n-cap.zero .ct { color: var(--ink4); }
/* 底部比例尺 */
.legend { position: absolute; left: 24px; right: 24px; bottom: 14px; display: flex; align-items: center; gap: 22px; font-size: 11px; color: var(--ink3); pointer-events: none; flex-wrap: wrap; }
.legend .scale { display: flex; align-items: center; gap: 10px; }
.legend .scale b { color: var(--ink2); font-weight: 600; }
.legend .ticks { display: flex; align-items: flex-end; height: 28px; gap: 6px; }
.legend .ticks i { display: block; width: 18px; border-radius: 2px; background: var(--neutral); opacity: .45; }
.legend .ticks em { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--ink3); margin-right: 6px; }
.legend .keys { display: flex; gap: 14px; }
.legend .keys span { display: inline-flex; align-items: center; gap: 6px; }
.legend .keys span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 20%, transparent); }
.legend .keys span.dir::before { display: none; }
.legend .keys span.dir { color: var(--ink2); }
.legend .keys span.own::before { background: conic-gradient(#0A84FF 0 25%, #FF9500 0 50%, #34C759 0 75%, #FFCC00 0); box-shadow: none; width: 8px; height: 8px; }
.legend .hint { margin-left: auto; color: var(--ink4); }
.legend .rule { flex: 0 0 auto; height: 1px; width: 1px; }
/* 对话面板 */
.panel { border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; transition: background .4s; }
.p-hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px 12px; }
.p-hd .av { width: 34px; height: 34px; position: relative; }
.p-hd .t b { display: block; font-size: 14px; font-weight: 650; }
.p-hd .t span { font-size: 11.5px; color: var(--ink3); }
.feed { margin: 0 12px; border-radius: 14px; background: var(--seg); padding: 10px 6px 6px 12px; }
.feed h4 { margin: 0 6px 6px 0; font-size: 11px; font-weight: 600; color: var(--ink3); letter-spacing: .06em; display: flex; justify-content: space-between; }
.feed h4 i { font-style: normal; font-weight: 500; letter-spacing: 0; }
.feed ul { list-style: none; margin: 0; padding: 0 6px 0 0; height: 128px; overflow: hidden; display: grid; align-content: start; gap: 2px; }
.feed li { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: center; font-size: 12px; color: var(--ink2); height: 24px; animation: feedIn .5s cubic-bezier(.2,.9,.3,1.2) both; }
.feed li .fa { width: 18px; height: 18px; position: relative; }
.feed li .ft { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed li .ft b { font-weight: 600; color: var(--ink); margin-right: 4px; }
.feed li .ft em { font-style: normal; color: var(--ink3); margin-right: 4px; }
.feed li time { font-family: var(--mono); font-size: 10.5px; color: var(--ink4); }
.feed li.k-ask .ft em { color: var(--amber); } .feed li.k-error .ft em { color: var(--red); }
@keyframes feedIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.chat { overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; min-height: 0; }
.chat::-webkit-scrollbar { width: 0; }
.day { align-self: center; font-size: 11px; color: var(--ink4); }
.msg { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; max-width: 92%; animation: msgIn .5s cubic-bezier(.2,.9,.3,1.15) both; }
.msg .ma { width: 26px; height: 26px; position: relative; margin-top: 2px; }
.msg .who { font-size: 11px; color: var(--ink3); margin: 0 0 3px 2px; }
.msg .who time { font-family: var(--mono); color: var(--ink4); margin-left: 6px; }
.bub { font-size: 13.5px; line-height: 1.55; padding: 8px 12px; border-radius: 4px 14px 14px 14px; background: var(--card); box-shadow: 0 0 0 .5px var(--line2); color: var(--ink); }
.msg.you { align-self: flex-end; grid-template-columns: 1fr; justify-items: end; }
.msg.you .bub { background: var(--ink); color: var(--bg); border-radius: 14px 4px 14px 14px; box-shadow: none; }
.msg.bot .bub { box-shadow: inset 2px 0 0 var(--bc), 0 0 0 .5px var(--line2); }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
.confirm { margin-top: 8px; border-radius: 12px; padding: 10px 12px; background: color-mix(in srgb, var(--amber) 10%, var(--card)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--amber) 35%, transparent); }
.confirm .ct1 { font-size: 12px; color: var(--ink2); display: flex; align-items: center; gap: 6px; }
.confirm .ct1 svg { color: var(--amber); flex: none; }
.confirm .ct2 { font-size: 13.5px; font-weight: 600; margin: 4px 0 10px; }
.confirm .btns { display: flex; gap: 8px; }
.confirm button { border: 0; border-radius: 8px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; background: var(--seg); font-weight: 500; }
.confirm button.ok { background: var(--ink); color: var(--bg); font-weight: 600; }
.confirm.done { background: var(--seg); box-shadow: none; } .confirm.done .ct1 svg { color: var(--ink3); }
.confirm.nudge { animation: nudge .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes nudge { 30% { transform: translateX(-4px); } 60% { transform: translateX(3px); } }
.composer { padding: 10px 14px 14px; }
.cbox { display: flex; align-items: flex-end; gap: 8px; border-radius: 16px; background: var(--card); box-shadow: 0 0 0 1px var(--line2), var(--shadow); padding: 8px 8px 8px 14px; transition: box-shadow .2s; }
.cbox:focus-within { box-shadow: 0 0 0 1px var(--ink3), var(--shadow-hi); }
.cbox textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; font: inherit; font-size: 13.5px; line-height: 1.5; color: var(--ink); height: 21px; max-height: 96px; padding: 3px 0; }
.cbox textarea::placeholder { color: var(--ink3); }
.send { width: 30px; height: 30px; border-radius: 9px; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; cursor: pointer; flex: none; transition: transform .2s, opacity .2s; }
.send:disabled { opacity: .25; cursor: default; }
.send:not(:disabled):active { transform: scale(.92); }
.c-hint { font-size: 11px; color: var(--ink4); margin: 7px 4px 0; display: flex; gap: 6px; flex-wrap: wrap; }
.c-hint button { border: 0; background: var(--seg); border-radius: 7px; padding: 3px 8px; font-size: 11px; color: var(--ink2); cursor: pointer; }
.c-hint button:hover { color: var(--ink); }
@media (max-width: 1180px) { .main { grid-template-columns: 1fr 360px; } }
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; grid-template-rows: 52px auto; }
  .top { grid-template-columns: auto 1fr auto; padding: 0 12px; gap: 10px; position: sticky; top: 0; }
  .brand small { display: none; }
  .seg { justify-self: center; } .seg button { padding: 5px 9px; font-size: 12.5px; }
  .main { grid-template-columns: 1fr; }
  .stage { height: var(--mh, 720px); }
  .panel { border-left: 0; border-top: 1px solid var(--line); grid-template-rows: auto auto auto auto; }
  .chat { max-height: none; overflow: visible; }
  .legend { left: 14px; right: 14px; gap: 10px; bottom: 10px; } .legend .keys { gap: 10px; flex-wrap: wrap; } .legend .hint { display: none; }
  .n-bot { width: 128px; } .n-bot .hd { padding: 8px 8px 8px 6px; } .n-bot .nm { font-size: 12.5px; } .n-bot .row1 { gap: 4px; } .pill { font-size: 0; padding: 0; gap: 0; background: none !important; order: -1; } .pill::before { width: 6px; height: 6px; } .n-bot .nm { white-space: nowrap; } .n-bot .hd { grid-template-columns: 36px 1fr; } .n-bot .av { width: 36px; height: 36px; } .col-h i { display: none; } .n-bot .hd { grid-template-columns: 40px 1fr; gap: 8px; height: 58px; } .n-bot .av { width: 40px; height: 40px; }
  .n-cap { width: 104px; } .n-cap .info { width: 88px; left: 14px; } .n-cap .nm { font-size: 12px; } .n-cap .ht { display: none; }
  .n-butler { width: 64px; border-radius: 16px; } .n-butler .av { width: 46px; height: 46px; } .n-butler .nm { font-size: 12.5px; } .n-butler .st { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7" fill="currentColor"/><path d="M5.5 15.5C9 15.5 9.5 8.5 13 8.5S16 12 18.5 12" fill="none" stroke="var(--bg)" stroke-width="2.2" stroke-linecap="round"/><circle cx="5.5" cy="15.5" r="1.7" fill="var(--bg)"/><circle cx="18.5" cy="12" r="1.7" fill="var(--bg)"/></svg>
      OyVerse<small>办公大厅</small>
    </div>
    <nav class="seg" aria-label="切换空间">
      <button aria-pressed="true">管家</button><button aria-pressed="false">自动化</button><button aria-pressed="false">运营</button><button aria-pressed="false">创作</button>
    </nav>
