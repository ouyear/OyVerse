<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OyVerse · 办公大厅 · C 等距办公室</title>
<script>
(function () {
  var q = new URLSearchParams(location.search).get('theme');
  var t = q === 'dark' || q === 'light' ? q : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --bg: #eeebe5; --bar: rgba(250,249,246,.82); --surface: #fbfaf8; --raised: #ffffff;
  --ink: #1d1d1f; --ink2: #5b5b60; --ink3: #8e8e93; --line: rgba(29,29,31,.09); --line2: rgba(29,29,31,.14);
  --accent: #1d1d1f; --accent-ink: #fff; --amber: #e8930c; --red: #e5484d; --green: #2fa55a;
  --chip: rgba(29,29,31,.055); --shadow: 0 1px 2px rgba(40,30,20,.06), 0 8px 28px rgba(40,30,20,.08);
  --pop-shadow: 0 2px 6px rgba(40,30,20,.08), 0 24px 60px rgba(40,30,20,.16);
  /* 场景材质：t 顶面 / l 左前面 / r 右前面 */
  --stage-a: #f3f0ea; --stage-b: #e4dfd6;
  --floor-t: #f7f4ee; --floor-l: #d9d2c6; --floor-r: #cbc3b5; --tile: rgba(120,100,70,.07);
  --wallA-t: #ece7de; --wallA-f: #f4f1eb; --wallB-t: #e6e0d6; --wallB-f: #e7e2d9;
  --wood-t: #e9dccb; --wood-l: #d6c4ad; --wood-r: #c6b296;
  --desk-t: #ffffff; --desk-l: #e8e4dd; --desk-r: #d9d4cb;
  --metal-t: #f1f1f2; --metal-l: #d8d8dc; --metal-r: #c7c7cc;
  --dark-t: #3a3a3f; --dark-l: #2b2b30; --dark-r: #222226;
  --plat-t: #fbf8f2; --plat-l: #e2d9c8; --plat-r: #d4c9b5;
  --gold: #d9a43a; --glass: #20242c; --glass-hi: rgba(255,255,255,.08);
  --lane: rgba(110,92,64,.13); --lane-core: rgba(255,255,255,.75); --win: #dfe9f0; --win-frame: #d6cfc3;
  --sun: rgba(255,246,222,.55); --lamp: 0; --shadow-c: rgba(70,52,30,.16);
  --label-bg: rgba(255,255,255,.86); --bubble-bg: rgba(255,255,255,.96);
}
[data-theme="dark"] {
  --bg: #121214; --bar: rgba(22,22,24,.78); --surface: #1a1a1d; --raised: #232327;
  --ink: #f2f2f4; --ink2: #b0b0b8; --ink3: #7c7c85; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.13);
  --accent: #f2f2f4; --accent-ink: #111; --amber: #ffb340; --red: #ff6961; --green: #4cd27a;
  --chip: rgba(255,255,255,.07); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
  --pop-shadow: 0 2px 6px rgba(0,0,0,.4), 0 24px 60px rgba(0,0,0,.55);
  --stage-a: #1b1a1d; --stage-b: #0e0e10;
  --floor-t: #2a2826; --floor-l: #1d1b19; --floor-r: #171513; --tile: rgba(255,230,190,.035);
  --wallA-t: #3a3632; --wallA-f: #2a2724; --wallB-t: #34302c; --wallB-f: #221f1d;
  --wood-t: #5a4a3a; --wood-l: #45382c; --wood-r: #3a2f25;
  --desk-t: #3b3936; --desk-l: #2c2a28; --desk-r: #242220;
  --metal-t: #45454a; --metal-l: #343438; --metal-r: #2a2a2e;
  --dark-t: #1f1f22; --dark-l: #18181a; --dark-r: #131315;
  --plat-t: #34302a; --plat-l: #26231f; --plat-r: #1f1c19;
  --gold: #f0bb52; --glass: #0d0f13; --glass-hi: rgba(255,255,255,.05);
  --lane: rgba(255,225,180,.07); --lane-core: rgba(255,220,170,.16); --win: #1b2433; --win-frame: #3a3530;
  --sun: rgba(255,246,222,0); --lamp: 1; --shadow-c: rgba(0,0,0,.45);
  --label-bg: rgba(30,30,33,.86); --bubble-bg: rgba(38,38,42,.97);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow: hidden; transition: background .6s ease, color .6s ease; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-rows: 56px 1fr; height: 100vh; height: 100dvh; }
.topbar { position: relative; z-index: 30; display: flex; align-items: center; padding: 0 16px 0 20px; background: var(--bar); backdrop-filter: saturate(1.6) blur(20px); -webkit-backdrop-filter: saturate(1.6) blur(20px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.brand svg { display: block; }
.spaces { position: absolute; left: 50%; transform: translateX(-50%); display: flex; padding: 3px; border-radius: 10px; background: var(--chip); }
.spaces button { white-space: nowrap; position: relative; z-index: 1; border: 0; background: none; padding: 5px 16px; font-size: 13px; color: var(--ink2); border-radius: 7px; cursor: pointer; transition: color .2s; }
.spaces button[aria-current="page"] { color: var(--ink); font-weight: 600; }
.spaces .pill { position: absolute; top: 3px; bottom: 3px; border-radius: 7px; background: var(--raised); box-shadow: 0 1px 3px rgba(0,0,0,.1), 0 0 0 .5px rgba(0,0,0,.04); transition: left .35s cubic-bezier(.3,1.3,.5,1), width .35s cubic-bezier(.3,1.3,.5,1); }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 9px; background: none; color: var(--ink2); cursor: pointer; transition: background .2s, color .2s; }
.icon-btn:hover { background: var(--chip); color: var(--ink); }
.icon-btn svg { width: 18px; height: 18px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
.stage { position: relative; overflow: hidden; min-height: 0; background: radial-gradient(120% 90% at 45% 40%, var(--stage-a), var(--stage-b)); transition: background .6s ease; }
.stage svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage-head { position: absolute; left: 24px; top: 20px; z-index: 5; pointer-events: none; }
.stage-head h1 { margin: 0; font-size: 22px; font-weight: 680; letter-spacing: -.02em; }
.stage-head p { margin: 4px 0 0; font-size: 13px; color: var(--ink2); display: flex; gap: 12px; flex-wrap: wrap; }
.stage-head p b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.stage-head .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.legend { position: absolute; left: 24px; bottom: 18px; z-index: 5; display: flex; gap: 14px; font-size: 12px; color: var(--ink3); pointer-events: none; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 2px; border-radius: 2px; background: currentColor; position: relative; }
.legend i::after { content: ""; position: absolute; right: -2px; top: -2px; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
.overlay { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink3); animation: typ 1s ease-in-out infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes typ { 0%, 100% { opacity: .3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
/* 场景 */
.scene .t { fill: var(--m-t); } .scene .l { fill: var(--m-l); } .scene .r { fill: var(--m-r); }
.scene polygon, .scene rect, .scene path { transition: fill .6s ease, stroke .6s ease, opacity .5s ease; }
.m-floor { --m-t: var(--floor-t); --m-l: var(--floor-l); --m-r: var(--floor-r); }
.m-wood { --m-t: var(--wood-t); --m-l: var(--wood-l); --m-r: var(--wood-r); }
.m-desk { --m-t: var(--desk-t); --m-l: var(--desk-l); --m-r: var(--desk-r); }
.m-metal { --m-t: var(--metal-t); --m-l: var(--metal-l); --m-r: var(--metal-r); }
.m-dark { --m-t: var(--dark-t); --m-l: var(--dark-l); --m-r: var(--dark-r); }
.m-plat { --m-t: var(--plat-t); --m-l: var(--plat-l); --m-r: var(--plat-r); }
.m-wallA { --m-t: var(--wallA-t); --m-l: var(--wallA-f); --m-r: var(--wallA-f); }
.m-wallB { --m-t: var(--wallB-t); --m-l: var(--wallB-f); --m-r: var(--wallB-f); }
.m-gold { --m-t: var(--gold); --m-l: color-mix(in srgb, var(--gold) 80%, #000); --m-r: color-mix(in srgb, var(--gold) 68%, #000); }
.tile { stroke: var(--tile); stroke-width: 1; fill: none; }
.win { fill: var(--win); } .win-frame { fill: var(--win-frame); }
.sun { fill: var(--sun); transition: fill .8s ease; }
.lamp-pool { opacity: var(--lamp); transition: opacity .8s ease; mix-blend-mode: screen; }
.lamp-bulb { fill: #fff3d6; opacity: calc(.35 + var(--lamp) * .65); }
.soft-shadow { fill: var(--shadow-c); }
.lane { stroke: var(--lane); stroke-width: 5; stroke-linecap: round; fill: none; }
.lane-core { stroke: var(--lane-core); stroke-width: 1.2; stroke-linecap: round; fill: none; }
.heat { fill: none; stroke-linecap: round; stroke-width: 3; opacity: 0; transition: opacity .9s ease, stroke .4s; }
.trail { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.screen-bg { fill: var(--glass); }
.screen-txt { font-family: var(--font); font-weight: 600; fill: #fff; }
.label-text { font-family: var(--font); fill: var(--ink3); font-weight: 600; }
.cap { cursor: default; }
.cap .cap-glow { opacity: 0; transition: opacity .5s ease; }
.cap.on .cap-glow { opacity: 1; }
.desk { cursor: pointer; }
.desk .halo { opacity: .0; transition: opacity .5s ease; }
.desk.state-working .halo { opacity: .55; }
.desk.state-waiting .halo, .desk.state-error .halo { opacity: .8; }
.desk.state-paused .monitor-content { opacity: .25; }
.desk.state-paused .lamp-pool { opacity: 0; }
.char-fo { overflow: visible; pointer-events: none; }
.char-host { width: 100%; height: 100%; }
.stage.focus .heat:not(.hl) { opacity: .04 !important; }
.stage.focus .lane:not(.hl) { opacity: .45; }
.stage.focus .desk:not(.hl), .stage.focus .cap:not(.hl) { opacity: .5; }
.stage.focus .lane.hl { stroke: var(--focus-c); opacity: .35; }
.desk, .cap { transition: opacity .35s ease; }
@keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
@keyframes flicker { 0%, 100% { opacity: 1 } 8% { opacity: .2 } 12% { opacity: 1 } 55% { opacity: .85 } 60% { opacity: .3 } 64% { opacity: 1 } }
.pulse-amber { animation: blink 1.6s ease-in-out infinite; }
.flick { animation: flicker 2.4s linear infinite; }
/* HTML 叠层：名牌、气泡、能力标签、弹层 */
.tag { position: absolute; transform: translate(-50%, 0); display: flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px; background: var(--label-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 .5px var(--line2); font-size: 12px; white-space: nowrap; transition: opacity .3s, transform .3s; }
.tag b { font-weight: 620; }
.tag em { font-style: normal; color: var(--ink3); }
.tag .sd { width: 7px; height: 7px; border-radius: 50%; }
.tag.waiting em { color: var(--amber); } .tag.error em { color: var(--red); }
.tag.waiting .sd { background: var(--amber) !important; box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 25%, transparent); animation: blink 1.6s infinite; }
.tag.error .sd { background: var(--red) !important; box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 25%, transparent); }
.tag.paused { opacity: .7; }
.tag.butler { padding: 4px 11px 4px 9px; font-size: 12.5px; }
.tag.butler .crown { width: 12px; height: 12px; color: var(--gold); }
.cap-tag { position: absolute; transform: translate(-50%, -100%); font-size: 11.5px; font-weight: 600; color: var(--ink2); white-space: nowrap; padding: 2px 8px; border-radius: 6px; transition: color .3s, background .3s, box-shadow .3s; }
.cap-tag small { display: block; font-size: 10.5px; font-weight: 450; color: var(--ink3); text-align: center; }
.cap-tag.on { color: var(--ink); background: var(--label-bg); box-shadow: 0 0 0 .5px var(--line2), 0 4px 14px rgba(0,0,0,.08); }
.bubble { position: absolute; transform-origin: 50% 100%; max-width: 230px; padding: 7px 11px; border-radius: 12px; background: var(--bubble-bg); box-shadow: var(--shadow), 0 0 0 .5px var(--line2); font-size: 12.5px; line-height: 1.4; color: var(--ink); pointer-events: none; }
.bubble::after { content: ""; position: absolute; left: var(--ax, 50%); bottom: -5px; width: 10px; height: 10px; background: var(--bubble-bg); transform: translateX(-50%) rotate(45deg); border-radius: 2px; box-shadow: .5px .5px 0 var(--line2); }
.bubble .k { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; margin-bottom: 2px; }
.pop { position: absolute; z-index: 20; width: 300px; padding: 16px; border-radius: 18px; background: var(--raised); box-shadow: var(--pop-shadow), 0 0 0 .5px var(--line2); pointer-events: auto; transform-origin: 50% 0; }
.pop-head { display: flex; gap: 12px; align-items: center; }
.pop-av { width: 56px; height: 56px; flex: none; border-radius: 16px; background: var(--chip); display: grid; place-items: center; }
.pop-av > div { width: 46px; height: 46px; }
.pop h3 { margin: 0; font-size: 16px; font-weight: 650; }
.pop .acct { font-size: 12px; color: var(--ink3); margin-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--chip); color: var(--ink2); }
.chip.working { color: var(--green); background: color-mix(in srgb, var(--green) 13%, transparent); }
.chip.waiting { color: var(--amber); background: color-mix(in srgb, var(--amber) 15%, transparent); }
.chip.error { color: var(--red); background: color-mix(in srgb, var(--red) 13%, transparent); }
.pop-sec { margin-top: 14px; }
.pop-sec h4 { margin: 0 0 6px; font-size: 11.5px; font-weight: 600; color: var(--ink3); }
.pop-step { font-size: 13.5px; line-height: 1.45; }
.bar { height: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.bar-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink2); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
.uses { display: flex; flex-wrap: wrap; gap: 6px; }
.uses span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 8px; border-radius: 8px; background: var(--chip); }
.uses svg { width: 13px; height: 13px; }
.uses .none { color: var(--ink3); background: none; padding: 0; }
.pop-actions { display: flex; gap: 8px; margin-top: 16px; }
.btn { flex: 1; height: 34px; border: 0; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--chip); transition: transform .15s, background .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
/* 对话面板 */
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--line); transition: background .6s ease; position: relative; }
.p-head { display: flex; align-items: center; gap: 11px; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
.p-av { width: 38px; height: 38px; flex: none; }
.p-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
.p-head p { margin: 1px 0 0; font-size: 12px; color: var(--ink3); }
.p-head p b { color: var(--ink2); font-weight: 600; }
.chat { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 8px; scroll-behavior: smooth; }
.msg { display: flex; gap: 9px; margin-bottom: 14px; align-items: flex-start; }
.msg .av { width: 28px; height: 28px; flex: none; margin-top: 16px; }
.msg .who { font-size: 11.5px; color: var(--ink3); margin: 0 0 4px 2px; display: flex; gap: 6px; }
.msg .body { min-width: 0; max-width: 82%; }
.msg .txt { display: inline-block; padding: 9px 12px; border-radius: 4px 14px 14px 14px; background: var(--raised); box-shadow: 0 0 0 .5px var(--line2); font-size: 13.5px; line-height: 1.5; }
.msg.you { justify-content: flex-end; }
.msg.you .body { text-align: right; }
.msg.you .txt { background: var(--accent); color: var(--accent-ink); box-shadow: none; border-radius: 14px 4px 14px 14px; text-align: left; }
.relay { display: flex; gap: 8px; margin-top: 7px; padding: 8px 10px; border-radius: 10px; background: var(--chip); font-size: 12.5px; line-height: 1.45; text-align: left; border-left: 3px solid var(--rc, var(--ink3)); }
.relay .rav { width: 20px; height: 20px; flex: none; }
.relay b { font-weight: 620; margin-right: 4px; }
.relay.err { --rc: var(--red); }
.confirm { margin-top: 8px; padding: 10px; border-radius: 12px; background: color-mix(in srgb, var(--amber) 10%, var(--raised)); box-shadow: 0 0 0 .5px color-mix(in srgb, var(--amber) 40%, transparent); font-size: 12.5px; }
.confirm .q { display: flex; gap: 6px; align-items: center; font-weight: 600; margin-bottom: 8px; }
.confirm .q svg { color: var(--amber); width: 14px; height: 14px; }
.confirm .row { display: flex; gap: 6px; }
.confirm .btn { height: 30px; font-size: 12.5px; }
.confirm.resolved { background: var(--chip); box-shadow: none; color: var(--ink3); }
.msg.fresh .txt { animation: msgIn .5s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px) scale(.97); } }
.nudge { animation: nudge .6s cubic-bezier(.3,1.6,.5,1); }
@keyframes nudge { 30% { transform: scale(1.03); } }
.feed { border-top: 1px solid var(--line); padding: 10px 18px 6px; max-height: 210px; display: flex; flex-direction: column; min-height: 0; }
.feed-h { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--ink3); margin-bottom: 6px; }
.feed-h button { border: 0; background: none; color: var(--ink3); font-size: 12px; cursor: pointer; }
.feed ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; min-height: 0; }
.feed li { display: grid; grid-template-columns: 8px auto 1fr auto; gap: 8px; align-items: center; padding: 5px 0; font-size: 12.5px; border-bottom: 1px solid var(--line); }
.feed li:last-child { border-bottom: 0; }
.feed li.new { animation: feedIn .5s cubic-bezier(.2,1.3,.4,1) both; }
@keyframes feedIn { from { opacity: 0; transform: translateX(-8px); } }
.feed .fd { width: 8px; height: 8px; border-radius: 50%; }
.feed .fn { font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.feed .fn svg { width: 12px; height: 12px; color: var(--ink3); }
.feed .fn .to { font-weight: 500; color: var(--ink2); }
.feed .ft { color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed .fa { color: var(--ink3); font-size: 11px; font-variant-numeric: tabular-nums; }
.feed li.k-error .ft { color: var(--red); } .feed li.k-ask .ft { color: var(--amber); }
.composer { padding: 10px 14px 14px; }
.cbox { display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 14px; border-radius: 16px; background: var(--raised); box-shadow: 0 0 0 .5px var(--line2), 0 2px 10px rgba(0,0,0,.05); transition: box-shadow .2s; }
.cbox:focus-within { box-shadow: 0 0 0 1.5px var(--ink3), 0 4px 16px rgba(0,0,0,.08); }
.cbox textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: var(--ink); font: inherit; font-size: 14px; line-height: 20px; height: 20px; max-height: 100px; padding: 4px 0; }
.cbox textarea::placeholder { color: var(--ink3); }
.send { width: 32px; height: 32px; flex: none; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; cursor: pointer; transition: transform .15s, opacity .2s; }
.send:disabled { opacity: .3; cursor: default; }
.send:not(:disabled):active { transform: scale(.92); }
.hint { font-size: 11px; color: var(--ink3); margin: 6px 4px 0; }

@media (max-width: 1100px) { .main { grid-template-columns: minmax(0, 1fr) 360px; } }
@media (max-width: 760px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100dvh; grid-template-rows: 52px auto; }
  .topbar { padding: 0 8px 0 12px; }
  .brand span { display: none; }
  .spaces button { padding: 5px 10px; font-size: 12.5px; }
  .stage svg.scene { top: 58px; height: calc(100% - 58px); }

  chat.scrollTop = chat.scrollHeight;
  return row;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const openCards = {};
function confirmCard(host, bot, label) {
  if (!bot) return;
  const c = document.createElement('div'); c.className = 'confirm';
  c.innerHTML = `<div class="q">${icon('alert', 2)}${bot.name}：${esc(label)}？</div><div class="row"><button class="btn primary">确认</button><button class="btn">暂不</button></div>`;
  host.appendChild(c); openCards[bot.id] = c;
  const [yes, no] = c.querySelectorAll('button');
  const done = (ok) => {
    delete openCards[bot.id];
    c.classList.add('resolved');
    c.innerHTML = `<div class="q" style="margin:0">${ok ? '已确认' : '已暂缓'}：${esc(label)}</div>`;
    bot.state = ok ? 'working' : 'idle'; bot.step = ok ? `正在${label}` : `暂缓「${label}」`;
    addChat({ from: 'butler', text: ok ? `好的，让${bot.name}去${label}。` : `好，先不动，${bot.name}会等你。`, time: new Date().toTimeString().slice(0, 5) }, true);
    const desk = S.desks[bot.id]; react(desk, desk.bot.state === 'working' ? 'happy' : 'idle', 1200);
    if (ok) onEvent({ kind: 'delegate', bot: bot.id, text: `交给${bot.name}：${label}`, at: new Date().toTimeString().slice(0, 5) });
    else syncDesk(desk);
    stats();
  };
  yes.onclick = () => done(true); no.onclick = () => done(false);
}
function askCard(bot, ev) {
  const open = openCards[bot.id];
  if (open && open.isConnected) { open.classList.remove('nudge'); void open.offsetWidth; open.classList.add('nudge'); open.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' }); return; }
  const label = ev.text.replace(/[吗？?]+$/g, '');
  const row = addChat({ from: 'butler', text: `${bot.name}需要你确认一件事。`, time: ev.at }, true);
  bot.step = `等你确认「${label}」`;
  confirmCard(row.querySelector('.txt'), bot, label);
}
const FEED_VERB = { delegate: '接到任务', report: '汇报', ask: '等你确认', error: '出错' };
function addFeed(ev) {
  const bot = D.bot(ev.bot), li = document.createElement('li');
  li.className = 'new k-' + ev.kind;
  const to = ev.kind === 'use' ? `${icon(ev.cap)}<span class="to">${D.cap(ev.cap).label}</span>` : `<span class="to">${FEED_VERB[ev.kind]}</span>`;
  li.innerHTML = `<span class="fd" style="background:${colorOf(bot)}"></span><span class="fn">${bot ? bot.name : '管家'} ${to}</span><span class="ft">${esc(ev.text)}</span><span class="fa">${ev.at}</span>`;
  feed.prepend(li);
  while (feed.children.length > 30) feed.lastChild.remove();
}
function stats() {
  const n = s => D.bots.filter(b => b.state === s).length;
  const parts = [['working', 'var(--green)'], ['waiting', 'var(--amber)'], ['idle', 'var(--ink3)'], ['error', 'var(--red)'], ['paused', 'var(--ink3)']]
    .filter(([s]) => n(s)).map(([s, c]) => `<span><span class="dot" style="background:${c}"></span><b>${n(s)}</b> ${D.STATE_LABEL[s]}</span>`);
  $('#stageStats').innerHTML = `<span>${D.bots.length} 个机器人</span>` + parts.join('');
  $('#pStatus').innerHTML = `正在协调 <b>${n('working')}</b> 个机器人` + (n('waiting') ? `，<b>${n('waiting')}</b> 件事等你` : '');
}
/* ---------------- 悬停高亮 + 点击详情 ---------------- */
function focusBot(id) {
  stage.classList.toggle('focus', !!id);
  const d = S.desks[id];
  stage.style.setProperty('--focus-c', d ? d.color : 'transparent');
  EDGES.forEach(e => { const on = !!id && e.bots.has(id); e.line && e.line.classList.toggle('hl', on); e.base && e.base.classList.toggle('hl', on); });
  Object.values(S.desks).forEach(x => x.g.classList.toggle('hl', x.bot.id === id));
  Object.values(S.caps).forEach(c => c.g.classList.toggle('hl', !!d && !!d.uses[c.key]));
}
let pop = null;
function closePop() { if (!pop) return; const p = pop; pop = null; p.animate([{ opacity: 1 }, { opacity: 0, transform: 'scale(.96)' }], { duration: 160, fill: 'forwards' }).finished.then(() => p.remove()); }
function openPop(desk) {
  closePop();
  const b = desk.bot, p = document.createElement('div'); p.className = 'pop'; pop = p;
  const used = Object.entries(desk.uses).sort((a, b) => b[1] - a[1]);
  const pct = Math.round(b.budget[0] / b.budget[1] * 100);
  p.innerHTML = `<div class="pop-head"><div class="pop-av"><div></div></div><div><h3>${b.name}</h3><div class="acct">${esc(b.account)}</div><div style="margin-top:6px"><span class="chip ${b.state}">${D.STATE_LABEL[b.state]}</span></div></div></div>
    <div class="pop-sec"><h4>正在做</h4><div class="pop-step">${esc(b.step)}</div></div>
    <div class="pop-sec"><div class="bar-row"><span>预算</span><span>${b.budget[0]} / ${b.budget[1]}</span></div><div class="bar"><i style="width:${pct}%;background:${desk.color}"></i></div></div>
    <div class="pop-sec"><h4>这次打开后用过的能力</h4><div class="uses">${used.length ? used.map(([k, n]) => `<span>${icon(k)}${D.cap(k).label} · ${n}</span>`).join('') : '<span class="none">还没有用过</span>'}</div></div>
    <div class="pop-actions">${b.state === 'waiting' && openCards[b.id] ? '<button class="btn primary" data-a="confirm">去确认</button>' : '<button class="btn primary" data-a="ask">给它派活</button>'}<button class="btn" data-a="close">关闭</button></div>`;
  stage.appendChild(p);
  mountChar(p.querySelector('.pop-av > div'), b, baseEmotion(b), 46);
  const r = stage.getBoundingClientRect(), [hx, hy] = screenToStage(...iso(desk.center[0], desk.center[1], 1));
  const w = p.offsetWidth, h = p.offsetHeight;
  let left = hx + 40, top = hy - h / 2;
  if (left + w > r.width - 12) left = hx - w - 40;
  left = Math.max(12, Math.min(r.width - w - 12, left)); top = Math.max(12, Math.min(r.height - h - 12, top));
  Object.assign(p.style, { left: left + 'px', top: top + 'px' });
  p.animate([{ opacity: 0, transform: 'translateY(8px) scale(.94)' }, { opacity: 1, transform: 'none' }], { duration: REDUCED ? 1 : 380, easing: 'cubic-bezier(.3,1.45,.5,1)' });
  p.addEventListener('click', e => {
    const a = e.target.closest('button') && e.target.closest('button').dataset.a;
    if (a === 'close') closePop();
    if (a === 'ask') { input.value = `让${b.name}`; input.focus(); input.dispatchEvent(new Event('input')); closePop(); }
    if (a === 'confirm') { const c = openCards[b.id]; c.scrollIntoView({ block: 'center', behavior: 'smooth' }); c.classList.remove('nudge'); void c.offsetWidth; c.classList.add('nudge'); closePop(); }
  });
}
function bindDesks() {
  Object.values(S.desks).forEach(d => {
    d.g.addEventListener('mouseenter', () => focusBot(d.bot.id));
    d.g.addEventListener('mouseleave', () => focusBot(null));
    d.g.addEventListener('click', e => { e.stopPropagation(); openPop(d); });
  });
  stage.addEventListener('click', e => { if (pop && !pop.contains(e.target)) closePop(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });
}
/* ---------------- 启动 ---------------- */
function fitView() {
  const narrow = stage.clientWidth < 760;
  const [lx] = iso(0, FD), [rx] = iso(FW, 0), [, ty] = iso(0, 0, WH + .5), [, by] = iso(FW, FD, -.6);
  const vb = narrow ? [iso(3, 19)[0] - 10, iso(1, 1, 4)[1], iso(22.5, 3)[0] - iso(3, 19)[0] + 20, iso(22.5, 19)[1] - iso(1, 1, 4)[1] + 10]
    : [lx - 40, ty - 70, rx - lx + 80, by - ty + 120];
  svg.setAttribute('viewBox', vb.map(v => v.toFixed(0)).join(' '));
  requestAnimationFrame(placeTags);
}
function theme(t) {
  const changed = document.documentElement.dataset.theme !== t;
  document.documentElement.dataset.theme = t;
  if (changed) butlerHosts.forEach(h => { if (!h.host.isConnected) return; const em = h.eng.emotionId; h.eng.destroy(); const e = mountChar(h.host, null, em, h.size); if (h.host === S.butler.host) S.butler.eng = e; });
  $('#icoSun').style.display = t === 'dark' ? 'none' : ''; $('#icoMoon').style.display = t === 'dark' ? '' : 'none';
}
function init() {
  buildRoom(); buildButler();
  D.bots.forEach(buildDesk);
  [buildData, buildPages, buildMaterials, buildPhone, buildMemory, buildDispatch, buildWorkflows, buildJudge, buildPlants].forEach(f => f());
  flushObjects(); buildGraph(); drawGraph();
  S.butler.eng = mountChar(S.butler.host, null, 'idle', 74);
  Object.values(S.desks).forEach(d => { d.eng = mountChar(d.host, d.bot, baseEmotion(d.bot), BOT_PX); });
  S.caps.phone.setHealth();
  fitView(); buildTags(); bindDesks(); stats();
  mountChar($('#pAv'), null, 'idle', 38);
  D.conversation.slice().sort((a, b) => a.time.localeCompare(b.time)).forEach(m => addChat(m, false));
  new ResizeObserver(fitView).observe(stage);
  // 顶栏
  const pill = $('.spaces .pill'), cur = $('.spaces [aria-current]');
  const movePill = b => { pill.style.left = b.offsetLeft + 'px'; pill.style.width = b.offsetWidth + 'px'; };
  movePill(cur);
  $('.spaces').addEventListener('mouseover', e => { if (e.target.tagName === 'BUTTON') movePill(e.target); });
  $('.spaces').addEventListener('mouseleave', () => movePill(cur));
  const q = new URLSearchParams(location.search).get('theme');
  theme(document.documentElement.dataset.theme);
  $('#themeBtn').onclick = () => theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  if (!q) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => theme(e.matches ? 'dark' : 'light'));
  // 输入框
  input.addEventListener('input', () => { sendBtn.disabled = !input.value.trim(); input.style.height = '20px'; input.style.height = Math.min(100, input.scrollHeight - 8) + 'px'; });
  const send = () => { const t = input.value.trim(); if (!t) return; input.value = ''; input.dispatchEvent(new Event('input')); userSays(t); };
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
  sendBtn.onclick = send;
  D.on(onEvent); D.start();
  document.title = 'OyVerse · 办公大厅 · C 等距办公室';
}
init();
</script>
