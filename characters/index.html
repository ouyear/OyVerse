<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OyVerse · 角色</title>
<style>
  :root { --bg:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --line:#e3e3e8; --card:#fff; }
  :root[data-theme='dark'] { --bg:#111113; --ink:#f2f2f4; --muted:#9a9aa3; --line:#2c2c31; --card:#1c1c1f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
  header { max-width: 1280px; margin: 0 auto; padding: 40px 32px 12px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  header p { margin: 6px 0 0; color: var(--muted); }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .tools button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .tools button[aria-pressed='true'] { background: var(--ink); color: var(--bg); }
  main { max-width: 1280px; margin: 0 auto; padding: 8px 32px 56px; overflow-x: auto; }
  table { border-collapse: separate; border-spacing: 0; min-width: 960px; width: 100%; }
  th { padding: 10px 8px; color: var(--muted); font-weight: 500; text-align: center; white-space: nowrap; }
  th small { display: block; font-weight: 400; font-size: 12px; }
  td { padding: 10px 8px; text-align: center; border-top: 1px solid var(--line); }
  td.name { text-align: left; font-weight: 600; white-space: nowrap; }
  td.name small { display: block; color: var(--muted); font-weight: 400; font-family: ui-monospace, Menlo, monospace; }
  .cell { display: inline-grid; place-items: center; width: 84px; height: 84px; }
  footer { max-width: 1280px; margin: 0 auto; padding: 0 32px 48px; color: var(--muted); font-size: 13px; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>OyVerse · 角色</h1>
    <p>每个角色 × 每种状态。状态由 <code>OyCharacter.create(host, { character, color, state }).setState(…)</code> 驱动，场景只管传状态。</p>
  </div>
  <div class="tools" id="colors" aria-label="身份色"></div>
  <div class="tools"><button type="button" id="theme">切换夜间</button><a href="../scenes/index.html" style="border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;text-decoration:none">看场景</a></div>
</header>
<main><table><thead id="head"></thead><tbody id="body"></tbody></table></main>
<footer>表情与眼睛来自 <a href="https://github.com/tycoding/grok-ball">Grok Ball</a>（MIT，tycoding）；身体、饰物与状态映射是 OyVerse 的部分。</footer>
<script src="../registry.js"></script>
<script src="oy-character.js"></script>
<script src="gallery.js"></script>
</body>
</html>
